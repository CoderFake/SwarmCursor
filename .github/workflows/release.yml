name: Release SwarmCursor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Run Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Build Library, Skills & Package Tarball
        run: |
          npm run build
          npm run build:site
          npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — SwarmCursor 2.0 (Rust/WASM SIMD128 + 3D/GLB + Deep DOM Subtask Swarm)"
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            dist-site/swarm-cursor-skills.zip
            swarm-cursor-*.tgz
