name: Release SwarmCursor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Test, Release & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Run Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Build Library, Skills & Package Tarball
        run: |
          npm run build
          npm run build:site
          npm pack

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — SwarmCursor 2.0 (Rust/WASM SIMD128 + 3D/GLB + Deep DOM Subtask Swarm)"
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            dist-site/swarm-cursor-skills.zip
            swarm-cursor-*.tgz

      - name: Publish to npmjs.org (if NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish --access public

      - name: Publish to GitHub Packages (@coderfake/swarm-cursor)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set @coderfake:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@coderfake/swarm-cursor";
            pkg.repository = { type: "git", url: "git+https://github.com/CoderFake/SwarmCursor.git" };
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm publish || true
